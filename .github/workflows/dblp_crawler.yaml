name: Auto Cite by Crawler

on:
  push:
    branches:
      - main

  pull_request:
    paths:
      - "_config.yaml"
  # workflow_dispatch:
  # schedule:
  #   - cron: "0 0 * * 1"

jobs:
  update_research:
    name: Auto Cite by Crawler
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    permissions:
      contents: write
    steps:
      - name: Checkout code
        uses: actions/checkout@v7
        with:
          persist-credentials: ${{ github.ref == 'refs/heads/main' }}
      - name: Set up Python
        uses: actions/setup-python@v7
        with:
          python-version: "3.12"
      - name: Install packages
        run: python -m pip install PyYAML==6.0.3
      - name: Build updated citations
        run: python ./auto-cite/auto-cite-by-crawler.py
      - name: Commit updated citations
        if: github.ref == 'refs/heads/main'
        uses: stefanzweifel/git-auto-commit-action@v7
        with:
          file_pattern: "_data/citations.yaml"
          commit_message: "Generate citations by crawler"
